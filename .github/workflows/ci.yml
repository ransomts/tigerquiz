# Runs the linter, the unit and end-to-end suites, the quiz validator and the
# type checker on every push. All of them also run locally: npm run lint,
# npm run test:unit, npm test, npm run test:auth, npm run check, npm run
# typecheck. npm run coverage reports on the units.
#
# This workflow is a required check on main, so a red build cannot land.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .node-version is the single source of truth for the major, so CI, the
      # Dockerfile and @types/node cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm test
      - run: npm run test:auth
      - run: npm run check
      - run: npm run typecheck
