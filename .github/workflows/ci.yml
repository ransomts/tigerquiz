# Runs the linter, both test suites, the quiz validator and the type checker on
# every push. All of them also run locally: npm run lint, npm test,
# npm run test:auth, npm run check, npm run typecheck.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .node-version is the single source of truth for the major, so CI, the
      # Dockerfile and @types/node cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:auth
      - run: npm run check
      - run: npm run typecheck
