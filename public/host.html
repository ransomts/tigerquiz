<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tigerquiz · host</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="pausedBanner" class="banner" hidden>Paused</div>
<main>
  <section id="setup" class="screen center active">
    <h1>🐅 tigerquiz</h1>
    <p class="muted">Pick a quiz from the <code>quizzes/</code> folder.</p>
    <select id="quizSel"></select>
    <select id="rosterSel"></select>
    <button id="createBtn" class="primary">Create game</button>
    <div id="setupErr" class="error"></div>
    <button id="rehearseBtn" class="linkbtn">Rehearse this quiz alone</button>
    <p class="muted"><a href="edit.html">Edit quizzes</a> · <a href="reports.html">Past game reports</a></p>
  </section>

  <section id="lobby" class="screen center">
    <h2 id="lobbyTitle"></h2>
    <div class="join-info">
      <img id="qr" class="qr" alt="QR code to join">
      <div>
        <p class="muted">Join at <strong id="joinUrl"></strong> with PIN</p>
        <div class="pin" id="lobbyPin"></div>
      </div>
    </div>
    <p id="rosterNote" class="muted" hidden></p>
    <p id="addrWarn" class="error" hidden></p>
    <div id="players" class="chips"></div>
    <p class="muted"><span id="playerCount">0</span> players · click a name to remove</p>
    <p class="muted small">Sound starts once you click Start.</p>
    <button id="startBtn" class="primary" disabled>Start</button>
  </section>

  <section id="question" class="screen">
    <div class="hud"><span id="qCount"></span><span id="qAnswered"></span><span id="qTimer"></span></div>
    <div class="timerbar"><div id="qBar"></div></div>
    <h1 id="qText" style="text-align:center"></h1>
    <img id="qImage" class="qimg" alt="" hidden>
    <div id="qBody"></div>
    <div class="row controls">
      <button id="prevBtn" title="Replay the previous question">◀ Back</button>
      <button id="pauseBtn">Pause</button>
      <button id="skipBtn">End question now</button>
      <select id="jumpSel" title="Jump to a question"></select>
    </div>
  </section>

  <section id="results" class="screen">
    <h2 id="rText" style="text-align:center"></h2>
    <div class="results-layout">
      <div class="panel results-chart">
        <div id="rBody"></div>
        <p id="rExplain" class="explain" hidden></p>
      </div>
      <div class="panel results-board">
        <h3 class="muted results-heading">Leaderboard</h3>
        <ol id="board" class="board"></ol>
      </div>
    </div>
    <div class="row controls">
      <button id="rPrevBtn" title="Ask this question again">◀ Ask again</button>
      <button id="revoteBtn" title="Let students discuss, then vote again">Discuss &amp; re-vote</button>
      <button id="nextBtn" class="primary">Next</button>
      <select id="rJumpSel" title="Jump to a question"></select>
    </div>
  </section>

  <section id="end" class="screen center">
    <h1>Final standings</h1>
    <div id="podium" class="podium"></div>
    <ol id="finalBoard" class="board"></ol>
    <div class="row">
      <button id="replayBtn" class="primary">Play again, same players</button>
      <button id="newGameBtn">New game</button>
      <a id="reportLink" class="btnlink" href="#">See the report</a>
    </div>
  </section>
</main>
<footer>
  <span id="hostPin"></span>
  <span class="muted">Space / Enter advances · <button id="muteBtn" class="linkbtn" title="Toggle sound">🔊 Sound on</button></span>
</footer>

<script src="socket.io/socket.io.js"></script>
<script src="sound.js"></script>
<script src="host.js"></script>
</body>
</html>
