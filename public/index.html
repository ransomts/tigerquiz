<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tigerquiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="pausedBanner" class="banner" hidden>Paused by the host</div>
<main>
  <section id="join" class="screen center active">
    <h1>tigerquiz</h1>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" placeholder="Game PIN" maxlength="6" autocomplete="off">
    <div id="gameTitle" class="muted"></div>
    <div class="namerow">
      <input id="name" placeholder="Nickname" maxlength="20" autocomplete="off">
      <button id="diceBtn" class="dice" title="Suggest a nickname">🎲</button>
    </div>
    <input id="ident" placeholder="" maxlength="40" autocomplete="off" hidden>
    <button id="joinBtn" class="primary">Join</button>
    <div id="joinErr" class="error"></div>
  </section>

  <section id="wait" class="screen center">
    <h2>You're in, <span id="waitName"></span>!</h2>
    <p id="waitTeam" class="teamline" hidden></p>
    <p class="muted">Watch the host screen. Questions appear here.</p>
  </section>

  <section id="question" class="screen">
    <div class="hud"><span id="qCount"></span><span id="qTimer"></span></div>
    <div class="timerbar"><div id="qBar"></div></div>
    <h2 id="qText" class="qtext" hidden></h2>
    <img id="qImage" class="qimg" alt="" hidden>
    <div id="prompt" class="prompt muted"></div>
    <div id="answerArea"></div>
    <div id="submitRow" class="row" hidden><button id="submitBtn" class="primary" disabled>Submit</button></div>
  </section>

  <section id="answered" class="screen center">
    <h2 id="answeredTitle">Answer locked in</h2>
    <p class="muted">Waiting for everyone else…</p>
  </section>

  <section id="result" class="screen">
    <div id="resultBox" class="fill">
      <div id="resultTitle" class="big"></div>
      <div id="resultStreak" class="streak" hidden></div>
      <div id="resultPts" style="font-size:1.5rem"></div>
      <div id="resultAnswer" class="answerline"></div>
      <div id="resultRank" class="rankline"></div>
      <div id="resultTeam" class="teamline" hidden></div>
      <div id="resultGap" class="muted"></div>
      <p id="resultExplain" class="explain" hidden></p>
      <button id="nextBtn" class="primary" hidden>Next question</button>
    </div>
  </section>

  <section id="end" class="screen center">
    <h1 id="endHeading">Game over</h1>
    <div id="endRank" class="big"></div>
    <div id="endScore" style="font-size:1.5rem"></div>
    <p id="endNote" class="muted" hidden></p>
    <button id="againBtn">Join another game</button>
  </section>
</main>
<footer><span id="me"></span><span id="status" class="muted"></span></footer>

<script src="socket.io/socket.io.js"></script>
<script src="play.js"></script>
</body>
</html>
